<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合約繳費計算</title>
<style>
  /* 深色介面：今日應收、審視日與到期日、時間軸分期；選取色為亮灰色。 */
  :root { color-scheme: dark;
    --bg:#0f1317; --panel:#171c22; --panel2:#1e252d; --ink:#eef1f4; --muted:#8e99a6; --line:#2a323b;
    --sel:#e6e9ed; --sel-fg:#12161b; --sel-bd:#e6e9ed; --sel-sub:#4a5563;
    --sans:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --num:"SF Pro Display","Segoe UI",Roboto,var(--sans); }
  * { box-sizing:border-box; }
  [hidden]{display:none!important}
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 var(--sans);
    padding:12px max(14px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  main { max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:2px 2px 0; }
  header span { color:var(--muted); font-size:.85rem; font-weight:600; }
  .logo { height:26px; width:auto; display:block; filter:invert(1); }
  .hero { background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px; }
  .hero .top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .hero small { color:var(--muted); font-size:.78rem; letter-spacing:.04em; display:block; }
  .hero .big { font:800 2.9rem/1.05 var(--num); letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin:3px 0 0; }
  .hero .ctx { font-size:.9rem; margin-top:6px; }
  .hero .ctx span { color:var(--muted); }
  .cp { flex:none; font:inherit; font-weight:700; border:0; border-radius:10px; padding:10px 14px; background:var(--sel); color:var(--sel-fg); cursor:pointer; margin-top:2px; }
  .meta { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .meta div { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-width:0; }
  .meta b { font:700 .95rem var(--num); font-variant-numeric:tabular-nums; display:block; white-space:nowrap; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lbl { font-size:.74rem; color:var(--muted); display:block; margin-bottom:5px; }
  input[type=date] { width:100%; min-height:44px; font:600 1rem var(--num); padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  .seg { display:flex; gap:6px; }
  .seg.wrap { flex-wrap:wrap; }
  .seg > div { position:relative; display:flex; flex:1 1 0; min-width:0; }
  .seg.wrap > div { flex:1 1 calc(50% - 3px); }
  .seg input { position:absolute; opacity:0; width:1px; height:1px; margin:0; }
  .seg label { flex:1; min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4px 2px; border:1px solid var(--line); border-radius:10px; background:var(--bg); cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; font-weight:600; font-size:.92rem; color:var(--ink); }
  .seg .sub { font:400 .68rem var(--num); color:var(--muted); }
  .seg input:checked + label { background:var(--sel); border-color:var(--sel-bd); color:var(--sel-fg); }
  .seg input:checked + label .sub { color:var(--sel-sub); }
  .seg input:focus-visible + label, .cp:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  /* 時間軸 */
  .tl { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 12px 8px; }
  .ev { display:grid; grid-template-columns:58px 20px 1fr; column-gap:8px; position:relative; padding-bottom:18px; }
  .ev .when { text-align:right; font-family:var(--num); }
  .ev .when b { display:block; font-size:1.02rem; line-height:1.2; font-variant-numeric:tabular-nums; }
  .ev .when span { font-size:.74rem; color:var(--muted); }
  .ev .dot { position:relative; display:flex; justify-content:center; }
  .ev .dot::before { content:""; position:absolute; top:22px; bottom:-18px; width:2px; background:var(--line); }
  .ev:last-of-type .dot::before { display:none; }
  .ev .dot i { width:13px; height:13px; border-radius:50%; background:var(--sel); margin-top:5px; position:relative; z-index:1; box-shadow:0 0 0 4px var(--panel); }
  .ev .what { min-width:0; }
  .ev .what b { display:block; font-size:.95rem; }
  .ev .what .amt { font:700 1.4rem var(--num); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .ev .what small { color:var(--muted); font-size:.8rem; display:block; }
  .ev.first .what { background:var(--panel2); border:1px solid var(--line); margin:-6px 0 0; padding:6px 10px 8px; border-radius:10px; }
  .tag { display:inline-block; font-size:.7rem; padding:1px 8px; border-radius:999px; background:var(--sel); color:var(--sel-fg); margin-left:6px; vertical-align:2px; font-weight:600; }
  .foot { display:flex; justify-content:space-between; align-items:baseline; gap:10px; border-top:1px solid var(--line); padding:12px 2px 10px; font-variant-numeric:tabular-nums; }
  .foot small { color:var(--muted); font-size:.8rem; }
  .foot b { font:800 1.3rem var(--num); }
  .err { color:var(--muted); padding:14px 2px; }
</style>
</head>

  const r1 = m.rows[0];
  const kindShort = m.kindName.replace(/（.*）/, '') + (m.kind === 'old1' ? ' 001–162' : m.kind === 'old2' ? ' 163 起' : '');
  hero.innerHTML = `<div class="top"><div><small>今日應收 · 第 1 期</small><div class="big">${money(r1.amt)}</div></div><button class="cp js-copy" type="button">複製成文字</button></div>
    <div class="ctx">${m.n} 堂 <span>·</span> ${kindShort}${m.trial ? ` <span>·</span> 含${m.trialName.replace('費', '')}` : ''}</div>
    <div class="meta"><div><small>合約審視日</small><b>${fmt(m.review)}</b></div><div><small>到期日 · 退費依據</small><b>${fmt(m.expiry)}</b></div></div>`;
  let h = '';
  m.rows.forEach((r, i) => {
    h += `<div class="ev${i === 0 ? ' first' : ''}"><div class="when"><b>${fmtShort(r.date)}</b><span>${wd(r.date)}</span></div><div class="dot"><i></i></div><div class="what"><b>第 ${r.i} 期${i === 0 ? '<span class="tag">簽約日</span>' : ''}</b><span class="amt">${money(r.amt)}</span>${r.note ? `<small>${r.note}</small>` : ''}</div></div>`;
  });
  h += `<div class="foot"><small>${m.trial ? `課程 ${money(m.course)} + 體驗 ${money(m.trial)} ＝ 總價` : '總價'}</small><b>${money(m.total)}</b></div>`;
  box.innerHTML = h;
}
</script>
<script>// ===== 共用邏輯（三個版本完全相同；與 standalone/index.html 的計算一致）=====
const PLANS = {
  10: { days: 50,  first: [14400, 9600],                       renew: [12600, 8400],
        old1: [12600, 8400],                       old2: [12600, 8400] },
  20: { days: 100, first: [12900, 12900, 12900, 4300],         renew: [12000, 12000, 12000, 4000],
        old1: [11400, 11400, 11400, 3800],         old2: [12000, 12000, 12000, 4000] },
  30: { days: 150, first: [12000, 12000, 12000, 12000, 12000], renew: [11400, 11400, 11400, 11400, 11400],
        old1: [10200, 10200, 10200, 10200, 10200], old2: [10800, 10800, 10800, 10800, 10800] },
  50: { days: 250, old1: [80000] }
};
const KIND_NAMES = { first: '首次加入（含會員費 $3,000）', renew: '續約', old1: '舊會員（001–162 號）', old2: '舊會員（163 號起）' };
const WD = ['日','一','二','三','四','五','六'];
const $ = id => document.getElementById(id);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const p2 = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())}（${WD[d.getDay()]}）`;
const fmtShort = d => `${d.getMonth()+1}/${d.getDate()}`;
const wd = d => '週' + WD[d.getDay()];
const money = n => '$' + n.toLocaleString('en-US');
const parseDate = v => { const [y,m,d] = v.split('-').map(Number); return new Date(y, m-1, d); };
const checked = name => document.querySelector(`input[name=${name}]:checked`).value;

function updateUnitPrices() {
  const kind = checked('k');
  Object.keys(PLANS).forEach(n => {
    const el = $('u' + n);
    if (el && PLANS[n][kind]) el.textContent = money(PLANS[n][kind].reduce((a, b) => a + b, 0) / n) + '／堂';
  });
  $('w50').hidden = !PLANS[50][kind];
  if ($('s50').checked && $('w50').hidden) $('s20').checked = true;
}

function model() {
  const v = $('date').value;
  if (!v) return null;
  const start = parseDate(v), n = checked('s'), kind = checked('k');
  const trial = Number(checked('t'));
  const trialName = trial === 1500 ? '物理治療師體驗費' : '教練體驗費';
  const plan = PLANS[n], amts = plan[kind];
  const course = amts.reduce((a, b) => a + b, 0);
  return {
    start, n, kind, kindName: KIND_NAMES[kind], trial, trialName, course, total: course + trial,
    review: addDays(start, -3), expiry: addDays(start, plan.days - 1), days: plan.days,
    rows: amts.map((a, i) => ({ i: i + 1, date: addDays(start, 30 * i), amt: a + (i === 0 ? trial : 0), base: a,
      note: i === 0 && trial ? `含${trialName} ${money(trial)}` : '' }))
  };
}

function copyTextOf(m) {
  return [
    `簽約日：${fmt(m.start)}`, `${m.n} 堂・${m.kindName}`, `合約審視日：${fmt(m.review)}`,
    ...m.rows.map(r => `第 ${r.i} 期：${fmt(r.date)}　${money(r.amt)}${r.note ? `（${r.note}）` : ''}`),
    `合約到期日：${fmt(m.expiry)}（僅作為退費依據）`,
    ...(m.trial ? [`課程費：${money(m.course)}`, `${m.trialName}：${money(m.trial)}`] : []),
    `總價：${money(m.total)}`
  ].join('\n');
}

function wireCopy(text) {
  document.querySelectorAll('.js-copy').forEach(btn => {
    const label = btn.dataset.label || btn.textContent;
    btn.dataset.label = label;
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(text); btn.textContent = '已複製 ✓'; }
      catch (e) {
        try { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); btn.textContent = '已複製 ✓'; }
        catch (e2) { btn.textContent = '請手動選取文字'; }
      }
      setTimeout(() => { btn.textContent = label; }, 1500);
    };
  });
}

function compute() {
  updateUnitPrices();
  const m = model();
  render(m);                       // 由各版本定義
  if (m) wireCopy(copyTextOf(m));
}

(function init() {
  const t = new Date();
  $('date').value = `${t.getFullYear()}-${p2(t.getMonth()+1)}-${p2(t.getDate())}`;
  document.querySelectorAll('input').forEach(i => i.addEventListener('change', compute));
  compute();
})();
</script>
</body>
